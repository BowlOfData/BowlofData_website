[build]
  # No build step: site/ is generated locally by `python3 build.py` and committed,
  # so Netlify only publishes the directory. Nothing here needs a database.
  publish = "site"

# The default Netlify subdomain serves the same files as the apex and Google has
# indexed pages on it. Domain-scoped, so deploy previews
# (deploy-preview-N--bowofdata.netlify.app) are unaffected. force = true is required:
# every path exists as a real file, and without it Netlify serves the file.
[[redirects]]
  from = "https://bowofdata.netlify.app/*"
  to = "https://bowlofdata.net/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images change rarely, but the filenames are not fingerprinted — a year-long
# max-age would strand an updated logo in caches for a year. A week is the
# compromise: repeat visitors skip the download, a change still propagates.
[[headers]]
  for = "/imgs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
