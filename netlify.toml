[build]
  # No build step: site/ is generated locally by `python3 build.py` and committed,
  # so Netlify only publishes the directory. Nothing here needs a database.
  publish = "site"

# The default Netlify subdomain serves the same files as the apex and Google has
# indexed pages on it. Domain-scoped, so deploy previews
# (deploy-preview-N--bowofdata.netlify.app) are unaffected. force = true is required:
# every path exists as a real file, and without it Netlify serves the file.
[[redirects]]
  from = "https://bowofdata.netlify.app/*"
  to = "https://bowlofdata.net/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()"
    # Everything is self-hosted: fonts, CSS, images, and the contact form posts to
    # the same origin. The inline scripts (cookie notice, contact form) and style
    # attributes are why script-src/style-src keep 'unsafe-inline'; JSON-LD is data
    # and is not subject to script-src. Changing the hosting of any asset means
    # changing this line, or the browser will silently block it.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'"

# The stylesheet is likewise unfingerprinted, so keep the cache short: an hour spares
# repeat views a revalidation round-trip on every page while a CSS change still lands
# within the hour.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Images change rarely, but the filenames are not fingerprinted — a year-long
# max-age would strand an updated logo in caches for a year. A week is the
# compromise: repeat visitors skip the download, a change still propagates.
[[headers]]
  for = "/imgs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
